# app_terminal CI: the tests on the host, then the Terminal App for every Linux target in the shared image
# (ci/build.sh), one Store package per platform - terminal-<key>-<version>.zip, laid out as Apps/terminal/.
# A v* tag publishes them as a release; develop keeps the rolling `nightly` pre-release current. Gated by
# AB_CI_ENABLED, like every autobleem2 repository.
name: build
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_DIR: /sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore sccache cache
        uses: actions/cache@v6
        with:
          path: /sccache
          key: sccache-terminal-${{ github.sha }}
          restore-keys: sccache-terminal-
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "AB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else echo "AB_VERSION=$(sed -n 's/^Version=//p' resources/app.ini)-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"; fi
      - name: Tests (host)
        run: ci/build.sh native
      - name: The console (psc)
        run: ci/build.sh psc
      - name: Raspberry Pi (rpi, rpi64)
        run: ci/build.sh rpi rpi64
      - name: The PC stick (pcusb)
        run: ci/build.sh pcusb
      - uses: actions/upload-artifact@v7
        with:
          name: terminal-packages
          path: dist/*.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: terminal-packages, path: out }
      - name: Attach to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "Terminal ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.zip || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.zip --clobber

  nightly:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: terminal-packages, path: out }
      - uses: autobleem2/autobleem-build/.github/actions/nightly-release@develop
        with:
          files: out/*.zip
