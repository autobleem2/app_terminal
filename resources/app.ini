[app]
Title=Terminal
Author=AutoBleem team
Version=1.0.0
Image=icon.png
Readme=readme.txt
# the program for this machine (docs/app-format-plan.md in the launcher): bin/psc/terminal on the console,
# bin/rpi, bin/rpi64, bin/pcusb on the appliances
Exec=bin/{key}/terminal
# run.sh adds the launcher's own SDL2 to the library path on the console, then starts Exec
Startup=run.sh
# it reads the pads itself (the on-screen keyboard); the virtual pad would only get in the way of the shell
VirtualPad=false
Kernel=false
